        #   npm run build

        #   # Ensure NGINX can serve the dist folder (Vite build assumed)
        #   sudo chown -R www-data:www-data ./dist
        #   sudo chmod -R 755 ./dist

        #   # Optional: restart PM2 if using dynamic app (e.g., SSR)
